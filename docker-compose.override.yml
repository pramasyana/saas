services:

  nginx:
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www
      - storage_app:/var/www/storage/app
      - public_images:/var/www/public/images

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
      - storage_framework:/var/www/storage/framework
      - public_images:/var/www/public/images
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  mariadb:
    ports:
      - "3306:3306"

  dozzle:
    ports:
      - "9999:8080"

  mailpit:
    image: axllent/mailpit
    container_name: saas-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped
    networks:
      - saas

volumes:
  storage_app:
  public_images:
