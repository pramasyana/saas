services:

  nginx:
    image: nginx:alpine
    container_name: saas-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_app:/var/www/storage/app
      - public_images:/var/www/public/images
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saas

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas-app
    volumes:
      - .:/var/www
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
      - storage_framework:/var/www/storage/framework
      - public_images:/var/www/public/images
    depends_on:
      mariadb:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: [ "CMD-SHELL", "php -r 'echo 1;'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - saas

  mariadb:
    image: mariadb:11
    container_name: saas-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-saas}
      MYSQL_USER: ${DB_USERNAME:-saas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - saas

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas-scheduler
    volumes:
      - .:/var/www
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
      - storage_framework:/var/www/storage/framework
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    command: php artisan schedule:work
    healthcheck:
      test: [ "CMD", "pidof", "sh" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - saas

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas-queue
    volumes:
      - .:/var/www
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
      - storage_framework:/var/www/storage/framework
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    healthcheck:
      test: [ "CMD", "pidof", "php" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - saas

  dozzle:
    image: amir20/dozzle:latest
    container_name: saas-dozzle
    command: [ "--auth-provider", "simple" ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/dozzle:/data
    ports:
      - "9999:8080"
    restart: unless-stopped
    networks:
      - saas

volumes:
  db_data:
  storage_app:
  storage_logs:
  storage_framework:
  public_images:

networks:
  saas:
    driver: bridge
