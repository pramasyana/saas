services:

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_app:/var/www/storage/app
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
      dozzle:
        condition: service_started
    restart: always

  app:
    volumes:
      - .:/var/www
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
      - storage_framework:/var/www/storage/framework
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: always

  mariadb:
    ports: []
    restart: always

  scheduler:
    restart: always

  queue:
    restart: always

  dozzle:
    ports: []
    restart: always
