services:

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/dozzle.conf:/etc/nginx/conf.d/dozzle.conf:ro
      - storage_app:/var/www/storage/app
      - public_images:/var/www/public/images
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: always

  app:
    volumes:
      - .:/var/www
      - storage_app:/var/www/storage/app
      - storage_logs:/var/www/storage/logs
      - storage_framework:/var/www/storage/framework
      - public_images:/var/www/public/images
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: always

  mariadb:
    ports: []
    restart: always

  scheduler:
    restart: always

  queue:
    restart: always

  dozzle:
    ports: []
    restart: always
